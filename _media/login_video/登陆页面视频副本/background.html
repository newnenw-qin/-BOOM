<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>背景</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f0ec;
        overflow: hidden;
      }

      .field {
        position: fixed;
        inset: 0;
        background: #f6f2ee;
        overflow: hidden;
      }

      .shape {
        position: absolute;
        pointer-events: none;
      }

      .cloud {
        top: -22%;
        right: -14%;
        width: 68vw;
        height: 62vh;
        background: radial-gradient(
          ellipse at 48% 46%,
          rgba(226, 132, 124, 0.78) 0%,
          rgba(232, 160, 152, 0.42) 36%,
          rgba(246, 226, 222, 0.16) 58%,
          rgba(246, 242, 238, 0) 72%
        );
        filter: blur(18px);
      }

      .orb {
        left: 40%;
        top: 14%;
        width: 28vw;
        height: 28vw;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 48%,
          #e45a54 0%,
          #e15a54 58%,
          rgba(226, 110, 104, 0.35) 74%,
          rgba(246, 242, 238, 0) 82%
        );
      }

      .corner {
        left: -18%;
        bottom: -46%;
        width: 54vw;
        height: 54vw;
        border-radius: 50%;
        background: #e2433c;
      }

      .blush {
        right: -10%;
        bottom: 6%;
        width: 42vw;
        height: 36vh;
        background: radial-gradient(
          ellipse at 40% 50%,
          rgba(240, 196, 188, 0.7) 0%,
          rgba(246, 220, 214, 0.28) 50%,
          rgba(246, 242, 238, 0) 72%
        );
        filter: blur(16px);
      }

      .silk {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="field" aria-hidden="true">
      <div class="shape cloud"></div>
      <div class="shape orb"></div>
      <div class="shape blush"></div>
      <div class="shape corner"></div>
      <svg class="silk" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
        <path
          fill="#f6ddd7"
          opacity="0.9"
          d="M-140 690C160 560 380 820 680 690C960 570 1120 800 1560 660L1560 1000L-140 1000Z"
        />
        <path
          fill="#fbf8f5"
          d="M-100 760C220 640 460 900 780 770C1060 660 1240 860 1600 750L1600 1000L-100 1000Z"
        />
      </svg>
    </div>
  </body>
</html>
